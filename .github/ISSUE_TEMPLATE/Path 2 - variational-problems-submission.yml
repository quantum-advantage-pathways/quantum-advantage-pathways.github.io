name: ⚛️ Path 2 - Variational Problems Submission
description: Submit a problem solution to the Variational Problems Tracker - Certifiable quantum solutions via the variational principle
title: "[Variational] "
labels: ["pathway: variational-problems", "submission"]
body:
  - type: markdown
    attributes:
      value: |
        ## ⚛️ Path 2 - Variational Problems

        Thank you for submitting a solution to the **Variational Problems Tracker**!

        This pathway focuses on guaranteed solution bounds and benchmarking against classical methods. Your submission should demonstrate variational bounds (energy values as upper bounds to true ground-state energy).

        Please provide detailed information about your submission below.

  - type: checkboxes
    id: submission-Path
    attributes:
      label: Check the Path submission
      description: Verify that your submission is for the Path 2 - Variational Problems Tracker
      options:
        - label: Path 2 submission
          required: true

  - type: input
    id: name
    attributes:
      label: Name
      description: Please provide a unique and identifiable name for your submission
      placeholder: 
    validations:
      required: true

  - type: input
    id: circuit
    attributes:
      label: Circuit
      description: The problem instance this submission addresses
      placeholder: e.g., "lih_molecule"
    validations:
      required: true

  - type: input
    id: energy
    attributes:
      label: Energy
      description: The ground-state energy value (upper bound) in UNIT OF MEASURE NEEDED. 
      placeholder: e.g., "-7.8823"
    validations:
      required: true

  - type: input
    id: error-bounds-low
    attributes:
      label: Error bounds (Low)
      description: Lower error bound (optional, default -1 if not provided)
      placeholder: e.g., "-0.001"
    validations:
      required: false

  - type: input
    id: error-bounds-high
    attributes:
      label: Error bounds (High)
      description: Upper error bound (optional, default +1 if not provided)
      placeholder: e.g., "+0.001"
    validations:
      required: false

  - type: input
    id: method-name
    attributes:
      label: Method
      description: Name for the method used in submission
      placeholder: e.g., "SQD"
    validations:
      required: true

  - type: textarea
    id: method-proof
    attributes:
      label: Method proof
      description: Link to paper, code repository, or detailed explanation of the method (required for verification)
      placeholder: |
        Provide at least one of:
        - Paper/preprint: https://arxiv.org/abs/...
        - Code repository: https://github.com/...
        - Method explanation: Detailed description of the approach
    validations:
      required: true

  - type: input
    id: institutions
    attributes:
      label: Institutions
      description: The institution(s) or organization(s) involved in the submission, separated by commas
      placeholder: 
    validations:
      required: true

  - type: input
    id: quantum-time
    attributes:
      label: Quantum time (seconds)
      description: Quantum execution time in seconds
      placeholder: e.g., "5.2"
    validations:
      required: true

  - type: input
    id: classical-time
    attributes:
      label: Classical time (seconds)
      description: Classical computation time in seconds
      placeholder: e.g., "9000"
    validations:
      required: false

  - type: input
    id: quantum-hardware
    attributes:
      label: Quantum hardware
      description: Quantum hardware specification
      placeholder: e.g., "IBM Heron r2"
    validations:
      required: true

  - type: input
    id: classical-hardware
    attributes:
      label: Classical hardware
      description: Classical hardware specification
      placeholder: e.g., "AMD EPYC 7763, 128 cores"
    validations:
      required: false

  - type: input
    id: submission-date
    attributes:
      label: Submission date
      description: Date of submission (YYYY-MM-DD)
      placeholder: "2025-10-29"
    validations:
      required: true


  - type: markdown
    attributes:
      value: |
        ---

        ### What happens next?

        Maintainers will review your submission for:
        - ✅ Reproducibility
        - ✅ Compliance with validation criteria (variational property)
        - ✅ Data fidelity and traceability
        - ✅ Transparent documentation of assumptions and uncertainties

        Thank you for contributing to Quantum Advantage Tracker! 🚀
