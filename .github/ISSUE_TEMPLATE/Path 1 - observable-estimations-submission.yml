name: 📊 Path 1 - Observable Estimations Submission
description: Submit a problem solution to the Observable Estimations Tracker - Trust through rigorous error control
title: "[Observable Estimations] "
labels: ["pathway: observable-estimations", "submission"]
body:
  - type: markdown
    attributes:
      value: |
        ## 📊 Path 1 - Observable Estimations Pathway

        Thank you for submitting a solution to the **Observable Estimations Tracker**!

        This pathway focuses on expectation-value experiments with mathematically grounded error bars. Your submission should demonstrate rigorous error control through techniques like QEC, QEM, or Post-Selected Error Detection.

        Please provide detailed information about your submission below.

  - type: checkboxes
    id: submission-Path
    attributes:
      label: Check the Path submission
      description: Validate that this submission is for the Path 1 - Observable Estimations Pathway
      options:
        - label: Path 1 submission
          required: true

  - type: input
    id: name
    attributes:
      label: Name
      description: Please provide a unique and identifiable name for your submission
      placeholder: 
    validations:
      required: true

  - type: input
    id: circuit
    attributes:
      label: Circuit
      description: The problem instance this submission addresses 
      placeholder: e.g., "operator_loschmidt_echo_49x2400"
    validations:
      required: true

  - type: input
    id: observable-value
    attributes:
      label: Observable value
      description: The measured expectation value of the observable
      placeholder: e.g., "0.732"
    validations:
      required: true

  - type: input
    id: error-bounds-low
    attributes:
      label: Error bounds (Low)
      description: Lower error bound (default -1 if not provided)
      placeholder: e.g., "-0.05"
    validations:
      required: false

  - type: input
    id: error-bounds-high
    attributes:
      label: Error bounds (High)
      description: Upper error bound (default +1 if not provided)
      placeholder: e.g., "+0.05"
    validations:
      required: false

  - type: input
    id: method-name
    attributes:
      label: Method
      description: Name for the method used in submission
      placeholder: e.g., "Global rescaling"
    validations:
      required: true
      
  - type: textarea
    id: method-proof
    attributes:
      label: Method proof
      description: Link to paper, code repository, or detailed explanation of the method (required for verification)
      placeholder: |
        Provide at least one of:
        - Paper/preprint: https://arxiv.org/abs/...
        - Code repository: https://github.com/...
        - Method explanation: Detailed description of the approach
    validations:
      required: true

  - type: input
    id: institutions
    attributes:
      label: Institutions
      description: The institution(s) or organization(s) involved in the submission, separated by commas
      placeholder: 
    validations:
      required: true

  - type: input
    id: quantum-time
    attributes:
      label: Quantum time (seconds)
      description: Quantum execution time in seconds
      placeholder: e.g., "5.2"
    validations:
      required: true

  - type: input
    id: classical-time
    attributes:
      label: Classical time (seconds)
      description: Classical computation time in seconds
      placeholder: e.g., "9000"
    validations:
      required: false

  - type: input
    id: quantum-hardware
    attributes:
      label: Quantum hardware
      description: Quantum hardware specification
      placeholder: e.g., "IBM Heron r2"
    validations:
      required: true

  - type: input
    id: classical-hardware
    attributes:
      label: Classical hardware
      description: Classical hardware specification
      placeholder: e.g., "AMD EPYC 7763, 128 cores"
    validations:
      required: false

  - type: input
    id: submission-date
    attributes:
      label: Submission Date
      description: Date of submission (YYYY-MM-DD)
      placeholder: "2025-10-29"
    validations:
      required: true


  - type: markdown
    attributes:
      value: |
        ---

        ### What happens next?

        Maintainers will review your submission for:
        - ✅ Reproducibility
        - ✅ Compliance with validation criteria
        - ✅ Data fidelity and traceability
        - ✅ Transparent documentation of assumptions and uncertainties

        Thank you for contributing to the Quantum Advantage Tracker! 🚀
