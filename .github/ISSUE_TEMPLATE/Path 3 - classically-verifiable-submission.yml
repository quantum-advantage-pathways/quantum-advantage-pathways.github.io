name: ✅ Path 3 - Classically Verifiable Problems Submission
description: Submit a problem solution for the Classically Verifiable Tracker - When quantum outputs are hard to find but easy to check
title: "[Verifiable] "
labels: ["pathway: classically-verifiable", "submission"]
body:
  - type: markdown
    attributes:
      value: |
        ## ✅ Path 3 - Classically Verifiable Problems

        Thank you for submitting a solution to the **Classically Verifiable Problems Tracker**!

        This pathway focuses on solutions that are hard to generate classically but easy to verify. Your submission should demonstrate quantum generation with efficient classical verification.

        Please provide detailed information about your submission below.

  - type: checkboxes
    id: submission-Path
    attributes:
      label: Check the Path submission
      description: Verify that your submission is for the Path 3 - Classically Verifiable Problems Tracker
      options:
        - label: Path 3 submission
          required: true

  - type: input
    id: name
    attributes:
      label: Name
      description: Please provide a unique and identifiable name for your submission
      placeholder: 
    validations:
      required: true


  - type: input
    id: circuit
    attributes:
      label: Circuit
      description: The problem instance this submission addresses
      placeholder: e.g., "peaked_random_53"
    validations:
      required: true


  - type: input
    id: value
    attributes:
      label: Value
      description: The claimed value (e.g., hamming distance for peak circuits)
      placeholder: e.g., "0.0023"
    validations:
      required: true


  - type: input
    id: method-name
    attributes:
      label: Method
      description: Name for the method used in submission
      placeholder: e.g., "Quantum + clustering"
    validations:
      required: true

  - type: textarea
    id: method-proof
    attributes:
      label: Method proof
      description: Link to paper, code repository, or detailed explanation of the method (required for verification)
      placeholder: |
        Provide at least one of:
        - Paper/preprint: https://arxiv.org/abs/...
        - Code repository: https://github.com/...
        - Method explanation: Detailed description of the approach
    validations:
      required: true

  - type: input
    id: institutions
    attributes:
      label: Institutions
      description: The institution(s) or organization(s) involved in the submission, separated by commas
      placeholder: 
    validations:
      required: true

  - type: input
    id: quantum-time
    attributes:
      label: Quantum time (seconds)
      description: Quantum execution time in seconds
      placeholder: e.g., "5.2"
    validations:
      required: true

  - type: input
    id: classical-time
    attributes:
      label: Classical time (seconds)
      description: Classical computation time in seconds
      placeholder: e.g., "9000"
    validations:
      required: false

  - type: input
    id: quantum-hardware
    attributes:
      label: Quantum hardware
      description: Quantum hardware specification
      placeholder: e.g., "IBM Heron r2"
    validations:
      required: true

  - type: input
    id: classical-hardware
    attributes:
      label: Classical hardware
      description: Classical hardware specification
      placeholder: e.g., "AMD EPYC 7763, 128 cores"
    validations:
      required: false

  - type: input
    id: submission-date
    attributes:
      label: Submission Date
      description: Date of submission (YYYY-MM-DD)
      placeholder: "2025-10-29"
    validations:
      required: true


  - type: markdown
    attributes:
      value: |
        ---

        ### What happens next?

        Maintainers will review your submission for:
        - ✅ Reproducibility
        - ✅ Compliance with validation criteria (efficient verification)
        - ✅ Data fidelity and traceability
        - ✅ Transparent documentation of assumptions and uncertainties

        Thank you for contributing to the Quantum Advantage Tracker! 🚀
